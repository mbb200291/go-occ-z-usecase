name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [matrix-demo, occ-visualizer]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race -count=1 -timeout=5m ./...
      - run: go vet ./...
